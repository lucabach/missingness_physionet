# PhysioNet/CinC 2019 early sepsis prediction (Reyna et al. 2020). Hourly, causal labels.
name: physionet2019
task: hourly            # one label per ICU hour (SepsisLabel, positive from 6 h before onset)
train_source: hospital1 # measures more on 23 of 34 variables, so thinning can match those (D11)
test_sources: [hospital1, hospital2]
max_hour: 59            # cut every record at ICU hour 59: non-septic records end there (D15)
static: [Age, Gender, Unit1, Unit2, HospAdmTime]
variables:
  # vital signs (8)
  - HR
  - O2Sat
  - Temp
  - SBP
  - MAP
  - DBP
  - Resp
  - EtCO2
  # laboratory values (26)
  - BaseExcess
  - HCO3
  - FiO2
  - pH
  - PaCO2
  - SaO2
  - AST
  - BUN
  - Alkalinephos
  - Calcium
  - Chloride
  - Creatinine
  - Bilirubin_direct
  - Glucose
  - Lactate
  - Magnesium
  - Phosphate
  - Potassium
  - Bilirubin_total
  - TroponinI
  - Hct
  - Hgb
  - PTT
  - WBC
  - Fibrinogen
  - Platelets
# Variables that enter the SOFA score (Singer et al. 2016), for the label-construction check
# (week 2). PaO2, GCS, urine output and vasopressors are not in PhysioNet 2019 (D13).
sofa_variables: [MAP, Platelets, Bilirubin_total, Creatinine, FiO2]
# Common-schedule ("snapshot") view for the RQ2 redesign (D29, proposed), used only with
# `features=snapshot`. One value per variable per bin (the last), shown at the bin end; a
# variable keeps its bin width only if >= min_coverage of the complete bins of the training
# records hold a value, otherwise it is hidden. Widths per variable can be set in
# variable_widths. Check the coverage first: python scripts/leak_audit.py --coverage
snapshot:
  fast_width: 4         # hours, vital signs (2 h: HR, MAP below 95% coverage)
  slow_width: 24        # hours, laboratory values
  fast_variables: [HR, O2Sat, Temp, SBP, MAP, DBP, Resp, EtCO2]
  variable_widths: {}   # e.g. {Temp: 4}
  min_coverage: 0.95
