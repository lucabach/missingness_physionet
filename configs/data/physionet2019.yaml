# PhysioNet/CinC 2019 early sepsis prediction (Reyna et al. 2020). Hourly, causal labels.
name: physionet2019
task: hourly            # one label per ICU hour (SepsisLabel, positive from 6 h before onset)
train_source: hospital1 # measures more on 23 of 34 variables, so thinning can match those (D11)
test_sources: [hospital1, hospital2]
static: [Age, Gender, Unit1, Unit2, HospAdmTime]
variables:
  # vital signs (8)
  - HR
  - O2Sat
  - Temp
  - SBP
  - MAP
  - DBP
  - Resp
  - EtCO2
  # laboratory values (26)
  - BaseExcess
  - HCO3
  - FiO2
  - pH
  - PaCO2
  - SaO2
  - AST
  - BUN
  - Alkalinephos
  - Calcium
  - Chloride
  - Creatinine
  - Bilirubin_direct
  - Glucose
  - Lactate
  - Magnesium
  - Phosphate
  - Potassium
  - Bilirubin_total
  - TroponinI
  - Hct
  - Hgb
  - PTT
  - WBC
  - Fibrinogen
  - Platelets
# Variables that enter the SOFA score (Singer et al. 2016), for the label-construction check
# (week 2). PaO2, GCS, urine output and vasopressors are not in PhysioNet 2019 (D13).
sofa_variables: [MAP, Platelets, Bilirubin_total, Creatinine, FiO2]
