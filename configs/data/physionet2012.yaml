# PhysioNet/CinC 2012 in-hospital mortality (Silva et al. 2012). First 48 h, one label per stay.
name: physionet2012
task: stay
static: [Age, Gender, Height, ICUType]
variables: [Albumin, ALP, ALT, AST, Bilirubin, BUN, Cholesterol, Creatinine, DiasABP, FiO2,
            GCS, Glucose, HCO3, HCT, HR, K, Lactate, Mg, MAP, MechVent, Na, NIDiasABP, NIMAP,
            NISysABP, PaCO2, PaO2, pH, Platelets, RespRate, SaO2, SysABP, Temp, TroponinI,
            TroponinT, Urine, WBC, Weight]
# Common-schedule ("snapshot") view for the RQ2 redesign (D29, proposed), see
# configs/data/physionet2019.yaml. Widths should divide 48 so the last hour closes a bin.
snapshot:
  fast_width: 4         # hours, vital signs and bedside measurements
  slow_width: 24        # hours, laboratory values (12 h: no lab reaches 95% coverage)
  fast_variables: [DiasABP, FiO2, GCS, HR, MAP, MechVent, NIDiasABP, NIMAP, NISysABP,
                   RespRate, SaO2, SysABP, Temp, Urine]
  variable_widths: {}
  min_coverage: 0.95
