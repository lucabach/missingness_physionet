# sepsis task, model gru. Run: python -m missingness.train configs/experiment/sepsis_gru.yaml inputs=pattern seed=1
data: physionet2019
model: gru
inputs: all          # values | pattern | all  (information ablation, RQ1)
seed: 0              # model seed; we use 0, 1, 2
split_seed: 0        # which committed split in splits/ to use; keep 0 unless decided otherwise
train:
  epochs: 30
  batch_size: 64
  lr: 1.0e-3
  weight_decay: 0.0
  grad_clip: 1.0
  patience: 5        # early stopping on validation AUROC
eval:
  n_boot: 1000       # patient bootstrap resamples for 95% CIs
# Chosen by the tuning sweep (2026-11-19, scripts/pick_config.py): best
# validation AUROC 0.7359 of 8 configurations, `all` inputs, seed 0.
tuned:
  model.hidden_size: 64
  train.lr: 1.0e-03
  train.weight_decay: 0.0e+00
