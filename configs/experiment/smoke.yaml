# Two-epoch run on synthetic data: checks that the whole pipeline works end to end.
data: synthetic
model: gru
inputs: all          # values | pattern | all  (information ablation, RQ1)
seed: 0              # model seed; we use 0, 1, 2
split_seed: 0        # which committed split in splits/ to use; keep 0 unless decided otherwise
train:
  epochs: 2
  batch_size: 64
  lr: 1.0e-3
  weight_decay: 0.0
  grad_clip: 1.0
  patience: 5        # early stopping on validation AUROC
eval:
  n_boot: 50         # patient bootstrap resamples for 95% CIs
